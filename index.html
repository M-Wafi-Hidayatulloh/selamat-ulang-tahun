<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Buat Ucapan Ulang Tahun</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <style>
    /* Animasi Badai Salju Lebat */
    @keyframes snowstormFast {
      0% { transform: translate(-10vw, -10vh) rotate(0deg) scale(0.6); opacity: 0; }
      10% { opacity: 0.9; }
      90% { opacity: 0.9; }
      100% { transform: translate(110vw, 110vh) rotate(360deg) scale(0.9); opacity: 0; }
    }

    @keyframes snowstormHeavy {
      0% { transform: translate(-20vw, -10vh) rotate(0deg) scale(1.1); opacity: 0; }
      15% { opacity: 1; }
      85% { opacity: 1; }
      100% { transform: translate(100vw, 110vh) rotate(720deg) scale(1.3); opacity: 0; }
    }

    @keyframes snowstormMicro {
      0% { transform: translate(-15vw, -5vh) rotate(0deg) scale(0.4); opacity: 0; }
      20% { opacity: 0.8; }
      80% { opacity: 0.8; }
      100% { transform: translate(115vw, 105vh) rotate(-360deg) scale(0.5); opacity: 0; }
    }

    .snow-1 { animation: snowstormFast 2.8s linear infinite; }
    .snow-2 { animation: snowstormHeavy 3.8s linear infinite; }
    .snow-3 { animation: snowstormMicro 2.2s linear infinite; }
    .snow-blur { filter: blur(1.5px); }

    /* Overlay Transisi Layar Halus */
    #transitionOverlay {
      opacity: 0;
      pointer-events: none;
      transition: opacity 0.6s cubic-bezier(0.4, 0, 0.2, 1);
    }
  </style>
</head>
<body class="bg-gradient-to-br from-sky-900 via-indigo-950 to-slate-900 flex items-center justify-center min-h-screen p-4 text-slate-800 relative overflow-hidden">

  <!-- OVERLAY TRANSISI LAYAR SAAT DIKLIK -->
  <div id="transitionOverlay" class="fixed inset-0 bg-slate-950 z-50 flex items-center justify-center">
    <div class="text-sky-200 text-lg font-semibold animate-pulse tracking-wider">Menyiapkan Kejutan... ✨</div>
  </div>

  <!-- EFEK BADAI SALJU LEBAT -->
  <div class="absolute left-[-10%] top-0 snow-3 snow-blur pointer-events-none z-0 text-white text-xl" style="animation-delay: 0s;">❄</div>
  <div class="absolute left-[10%] top-0 snow-3 pointer-events-none z-0 text-sky-100 text-lg" style="animation-delay: 0.7s;">❄</div>
  <div class="absolute left-[25%] top-0 snow-3 snow-blur pointer-events-none z-0 text-white text-base" style="animation-delay: 1.4s;">❄</div>
  <div class="absolute left-[40%] top-0 snow-3 pointer-events-none z-0 text-sky-200 text-xl" style="animation-delay: 0.3s;">❄</div>
  <div class="absolute left-[55%] top-0 snow-3 snow-blur pointer-events-none z-0 text-white text-sm" style="animation-delay: 1.1s;">❄</div>
  <div class="absolute left-[70%] top-0 snow-3 pointer-events-none z-0 text-sky-100 text-lg" style="animation-delay: 0.5s;">❄</div>
  <div class="absolute left-[85%] top-0 snow-3 snow-blur pointer-events-none z-0 text-white text-base" style="animation-delay: 1.8s;">❄</div>

  <div class="absolute left-[-15%] top-0 snow-1 pointer-events-none z-0 text-white text-3xl" style="animation-delay: 0.2s;">❄</div>
  <div class="absolute left-[5%] top-0 snow-1 pointer-events-none z-0 text-sky-100 text-2xl" style="animation-delay: 1.3s;">❅</div>
  <div class="absolute left-[20%] top-0 snow-1 pointer-events-none z-0 text-white text-3xl" style="animation-delay: 2.1s;">❆</div>
  <div class="absolute left-[35%] top-0 snow-1 pointer-events-none z-0 text-sky-200 text-2xl" style="animation-delay: 0.9s;">❄</div>
  <div class="absolute left-[50%] top-0 snow-1 pointer-events-none z-0 text-white text-3xl" style="animation-delay: 1.7s;">❅</div>
  <div class="absolute left-[65%] top-0 snow-1 pointer-events-none z-0 text-sky-100 text-2xl" style="animation-delay: 0.4s;">❆</div>
  <div class="absolute left-[80%] top-0 snow-1 pointer-events-none z-0 text-white text-3xl" style="animation-delay: 2.5s;">❄</div>

  <div class="absolute left-[-20%] top-0 snow-2 pointer-events-none z-0 text-white text-5xl" style="animation-delay: 0.6s;">❆</div>
  <div class="absolute left-[15%] top-0 snow-2 snow-blur pointer-events-none z-0 text-sky-200 text-4xl" style="animation-delay: 1.9s;">❄</div>
  <div class="absolute left-[45%] top-0 snow-2 pointer-events-none z-0 text-white text-5xl" style="animation-delay: 0.1s;">❅</div>
  <div class="absolute left-[75%] top-0 snow-2 snow-blur pointer-events-none z-0 text-sky-100 text-4xl" style="animation-delay: 1.5s;">❆</div>

  <!-- KARTU FORM INPUT UTAMA -->
  <div id="formCard" class="bg-sky-200/90 backdrop-blur-md p-8 rounded-3xl shadow-2xl w-full max-w-md border-2 border-sky-300 z-10 transition-all duration-500 transform scale-100 opacity-100">
    
    <div class="text-center mb-6">
      <!-- LOGO KUE ULANG TAHUN ANIMATIF -->
      <div class="flex justify-center mb-3">
        <svg class="w-28 h-28 drop-shadow-md animate-bounce" viewBox="0 0 200 200" fill="none" xmlns="http://www.w3.org/2000/svg">
          <ellipse cx="100" cy="175" rx="85" ry="12" fill="#BAE6FD"/>
          <path d="M 30 130 Q 100 150 170 130 L 170 165 Q 100 185 30 165 Z" fill="#4A2511"/>
          <path d="M 30 120 Q 100 140 170 120 L 170 145 Q 100 165 30 145 Z" fill="#00D8F6"/>
          <path d="M 30 120 Q 50 135 70 120 Q 90 135 110 120 Q 130 135 150 120 Q 170 135 170 120 L 170 130 Q 100 150 30 130 Z" fill="#FF4081"/>
          <path d="M 45 85 Q 100 105 155 85 L 155 125 Q 100 145 45 125 Z" fill="#00D8F6"/>
          <path d="M 45 85 Q 60 105 75 90 Q 90 110 105 88 Q 120 108 135 88 Q 148 105 155 85 Q 100 100 45 85 Z" fill="#3D1E0B"/>
          <path d="M 65 110 L 67 115 L 72 115 L 68 118 L 70 123 L 65 120 L 60 123 L 62 118 L 58 115 L 63 115 Z" fill="#FF4081"/>
          <path d="M 135 110 L 137 115 L 142 115 L 138 118 L 140 123 L 135 120 L 130 123 L 132 118 L 128 115 L 133 115 Z" fill="#FF4081"/>
          <path d="M 60 55 Q 100 70 140 55 L 140 90 Q 100 105 60 90 Z" fill="#2A1408"/>
          <rect x="60" y="68" width="80" height="5" rx="2" fill="#FFFFFF"/>
          <ellipse cx="100" cy="55" rx="40" ry="12" fill="#3D1E0B"/>
          <circle cx="100" cy="52" r="8" fill="#00D8F6"/>
          <circle cx="75" cy="54" r="6" fill="#FFF"/>
          <circle cx="125" cy="54" r="6" fill="#FFF"/>
          <rect x="73" y="25" width="4" height="26" fill="#00D8F6" rx="1"/>
          <rect x="98" y="18" width="4" height="30" fill="#00D8F6" rx="1"/>
          <rect x="123" y="25" width="4" height="26" fill="#00D8F6" rx="1"/>
          <path d="M 75 16 Q 78 21 75 25 Q 72 21 75 16 Z" fill="#FFB300"/>
          <path d="M 100 8 Q 103 14 100 18 Q 97 14 100 8 Z" fill="#FFB300"/>
          <path d="M 125 16 Q 128 21 125 25 Q 122 21 125 16 Z" fill="#FFB300"/>
        </svg>
      </div>
      
      <h2 class="text-2xl font-black text-sky-950">HAII BESTT 👋</h2>
      <p class="text-sm text-sky-800 mt-1 font-medium">Masukkan namaa & tanggal lahir untuk membukaa</p>
    </div>
    
    <!-- FORM INPUT NAMA & TANGGAL LAHIR -->
    <form id="birthdayForm" class="space-y-4">
      <div>
        <label class="block text-sm font-bold text-sky-950 mb-1">Namaa Kamuu</label>
        <input type="text" id="nama" required placeholder="Contoh: Siska" class="w-full p-3 bg-sky-50 border border-sky-300 rounded-xl focus:ring-2 focus:ring-sky-600 focus:bg-white outline-none text-slate-900 placeholder-sky-400 font-medium shadow-sm">
      </div>

      <div>
        <label class="block text-sm font-bold text-sky-950 mb-1">Tanggal Lahir kamuu</label>
        <input type="date" id="dob" required class="w-full p-3 bg-sky-50 border border-sky-300 rounded-xl focus:ring-2 focus:ring-sky-600 focus:bg-white outline-none text-slate-900 font-medium shadow-sm">
      </div>

      <button type="submit" class="w-full bg-gradient-to-r from-sky-500 to-blue-600 hover:from-sky-600 hover:to-blue-700 text-white font-bold p-3.5 rounded-xl transition duration-200 shadow-lg shadow-sky-400/40 tracking-wide text-lg flex items-center justify-center gap-2">
        <span>Open</span>
        <svg xmlns="http://www.w3.org/2000/svg" class="h-5 w-5" fill="none" viewBox="0 0 24 24" stroke="currentColor">
          <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M14 5l7 7m0 0l-7 7m7-7H3" />
        </svg>
      </button>
    </form>
  </div>

  <script>
    document.getElementById('birthdayForm').addEventListener('submit', function(e) {
      e.preventDefault();
      
      const nama = encodeURIComponent(document.getElementById('nama').value);
      const dob = document.getElementById('dob').value;
      
      const formCard = document.getElementById('formCard');
      const overlay = document.getElementById('transitionOverlay');

      // Animasi Kartu Mengecil & Fade Out
      formCard.classList.remove('scale-100', 'opacity-100');
      formCard.classList.add('scale-95', 'opacity-0');
      
      // Tampilkan Overlay Gelap Transisi
      overlay.style.opacity = '1';

      // Pindah ke ucapan.html bersama parameter nama & dob
      setTimeout(() => {
        window.location.href = `ucapan.html?nama=${nama}&dob=${dob}`;
      }, 600);
    });
  </script>
</body>
</html>
